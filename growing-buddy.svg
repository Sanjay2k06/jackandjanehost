<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" role="img" aria-labelledby="title description">
  <title id="title">Growing Buddy</title>
  <desc id="description">An original friendly green character with sprout leaves, a warm smile, and little red shoes.</desc>
  <style>
    .buddy { transform-box: fill-box; transform-origin: center; animation: buddy-bob 3.8s ease-in-out infinite; }
    .sprout-left { transform-box: fill-box; transform-origin: 100% 100%; animation: leaf-wave 3.8s ease-in-out infinite; }
    .sprout-right { transform-box: fill-box; transform-origin: 0 100%; animation: leaf-wave 3.8s ease-in-out -1.2s infinite; }
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 5.2s ease-in-out infinite; }
    @keyframes buddy-bob { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-5px) rotate(1deg); } }
    @keyframes leaf-wave { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(7deg); } }
    @keyframes blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.12); } }
    @media (prefers-reduced-motion: reduce) {
      .buddy, .sprout-left, .sprout-right, .blink { animation: none; }
    }
  </style>
  <ellipse cx="120" cy="237" rx="63" ry="10" fill="#183d34" opacity=".12"/>
  <g class="buddy">
    <path d="M92 49c-23-31-5-45 12-29 7 7 11 17 12 27-9 5-17 6-24 2Z" fill="#86b978" stroke="#285c4d" stroke-width="4" stroke-linejoin="round" class="sprout-left"/>
    <path d="M133 46c5-32 28-36 29-14 0 10-5 20-13 27-8-2-13-6-16-13Z" fill="#b4d58c" stroke="#285c4d" stroke-width="4" stroke-linejoin="round" class="sprout-right"/>
    <path d="M120 43c-2-10-1-18 2-25" fill="none" stroke="#285c4d" stroke-width="4" stroke-linecap="round"/>
    <path d="M70 115c-20 1-30 14-29 31 1 11 7 20 17 25l12 4" fill="none" stroke="#285c4d" stroke-width="13" stroke-linecap="round"/>
    <path d="M170 115c20 1 30 14 29 31-1 11-7 20-17 25l-12 4" fill="none" stroke="#285c4d" stroke-width="13" stroke-linecap="round"/>
    <path d="M81 148c0-25 16-43 39-43s39 18 39 43v52c0 18-14 31-39 31s-39-13-39-31Z" fill="#6fa66b" stroke="#285c4d" stroke-width="5"/>
    <path d="M92 195c-2 17-2 24 1 33" fill="none" stroke="#285c4d" stroke-width="12" stroke-linecap="round"/>
    <path d="M148 195c2 17 2 24-1 33" fill="none" stroke="#285c4d" stroke-width="12" stroke-linecap="round"/>
    <path d="M78 220c-9 0-15 5-15 12 0 6 6 10 18 10h17v-10c0-7-8-12-20-12Z" fill="#f28b72" stroke="#285c4d" stroke-width="4"/>
    <path d="M162 220c9 0 15 5 15 12 0 6-6 10-18 10h-17v-10c0-7 8-12 20-12Z" fill="#f28b72" stroke="#285c4d" stroke-width="4"/>
    <path d="M69 68c0-26 22-43 51-43s51 17 51 43v45c0 29-21 49-51 49s-51-20-51-49Z" fill="#fff3dd" stroke="#285c4d" stroke-width="5"/>
    <path d="M88 96c0-6 4-10 9-10s9 4 9 10" fill="none" stroke="#183d34" stroke-width="5" stroke-linecap="round" class="blink"/>
    <path d="M134 96c0-6 4-10 9-10s9 4 9 10" fill="none" stroke="#183d34" stroke-width="5" stroke-linecap="round" class="blink"/>
    <ellipse cx="82" cy="113" rx="9" ry="5" fill="#f28b72" opacity=".6"/>
    <ellipse cx="158" cy="113" rx="9" ry="5" fill="#f28b72" opacity=".6"/>
    <path d="M107 111c3 3 7 5 13 5s10-2 13-5" fill="none" stroke="#183d34" stroke-width="4" stroke-linecap="round"/>
    <path d="M105 126c5 7 11 10 15 10s10-3 15-10" fill="none" stroke="#183d34" stroke-width="4" stroke-linecap="round"/>
    <path d="M89 71c8-7 16-7 23-2M128 69c7-5 15-5 23 2" fill="none" stroke="#d7a45e" stroke-width="3" stroke-linecap="round"/>
    <path d="M120 172c-8-9-22-3-19 8 2 8 12 14 19 19 7-5 17-11 19-19 3-11-11-17-19-8Z" fill="#ffd8c2" stroke="#285c4d" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
